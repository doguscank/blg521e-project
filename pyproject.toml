[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "self-parking-python"
version = "0.1.0"
description = "Python reimplementation of self-parking-car-evolution-js"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "BLG521E Project" }
]
dependencies = [
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]
viz = [
  "matplotlib>=3.8",
]
notebook = [
  "jupyter>=1.0",
  "ipykernel>=6.0",
  "matplotlib>=3.8",
]

[project.scripts]
spce = "self_parking.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
